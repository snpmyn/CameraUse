apply plugin: 'com.android.library'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    compileOptions {
        // 源代码兼容 Java 8 (可按需设)
        sourceCompatibility = rootProject.ext.sourceCompatibility
        // 生成的字节码兼容 Java 8 (可按需设)
        targetCompatibility = rootProject.ext.targetCompatibility
    }

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "STL_NAME", "\"${project.property("STL_NAME")}\""

        // consumer-rules.pro 会合并到最终 APK
        // consumer-rules.pro 专门用于传递给主应用 (消费者)。它指定的规则是确保主应用在混淆时，能正确处理这个库的代码。这些规则会被打包到 AAR 中。
        // proguard-rules.pro 仅用于当前 Library 自身构建时的混淆
        // proguard-rules.pro 不会自动传递给引用它的 App
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            // library 通设 false
            // 交由 App 统一混淆
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    api fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:${androidxAppcompatVersion}"
    /*preference*/
    implementation "androidx.preference:preference:1.0.0"
    /*legacy-support*/
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    /*recyclerview*/
    implementation "androidx.recyclerview:recyclerview:1.0.0"
}